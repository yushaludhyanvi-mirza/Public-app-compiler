name: Secure Free Dual-Repo Build
on:
  workflow_dispatch: # Let's you manually click "Run workflow"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Secretly clone your private repository using your PAT
      - name: Checkout Private Repository
        uses: actions/checkout@v4
        with:
          repository: 'YOUR_GITHUB_USERNAME/YOUR_PRIVATE_REPO_NAME'
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      # 2. Set up the Kotlin/Java environment
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      # 3. Grant compile permissions
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Build your Kotlin HTML / Multiplatform package
      - name: Build Web App Distribution
        run: ./gradlew build # Or your specific framework distribution command (e.g., ./gradlew browserDistribution)

      # 5. SECURE STEP: Encrypt the final package with a password before saving it publicly
      - name: Upload Encrypted Package
        uses: AlexGidarakos/upload-encrypted-artifact@v1
        with:
          # Point this path to where your built files are generated (e.g., build/distributions)
          source: 'build/distributions/' 
          remote-name: 'secure-app-build'
          password: ${{ secrets.ARTIFACT_PASSWORD }} # Save a random password in your GitHub Secrets
          retention-days: 1 # Instantly wipes it from GitHub's servers after 24 hours
