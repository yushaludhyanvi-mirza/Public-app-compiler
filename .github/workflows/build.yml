name: Build Private APK for Free
on:
  # This lets you trigger the build manually with a click of a button in your public repo
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Pull your PRIVATE code into the runner using your secret token
      - name: Checkout Private Repository
        uses: actions/checkout@v4
        with:
          repository: 'YOUR_GITHUB_USERNAME/YOUR_PRIVATE_REPO_NAME' # Change this to your repos
          token: ${{ secrets.PRIVATE_REPO_TOKEN }} # Uses your hidden key to gain access

      # 2. Set up Java environment needed for Android
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      # 3. Grant execute permission to Gradle wrapper
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Build the actual APK
      - name: Build APK
        run: ./gradlew assembleRelease

      # 5. Save the finished APK so you can download it
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-app-release-apk
          path: app/build/outputs/apk/release/app-release.apk # Standard path for native Android apps
          retention-days: 1 # Automatically deletes it tomorrow so your storage stays free
